name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  PACKAGE_VERSION_SUFFIX: preview.${{ github.run_number }}

jobs:
  build-test:
    name: Build and test .NET 8/9/10 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore XBullet.EasyTesting.sln

      - name: Verify formatting
        run: dotnet format XBullet.EasyTesting.sln --verify-no-changes --no-restore

      - name: Build
        run: >-
          dotnet build XBullet.EasyTesting.sln
          --configuration Release
          --no-restore

      - name: Test
        run: >-
          dotnet test XBullet.EasyTesting.sln
          --configuration Release
          --no-build
          --results-directory TestResults
          --report-xunit-trx
          --coverage
          --coverage-settings eng/snapshot-coverage.settings.xml
          --coverage-output-format cobertura

      - name: Verify snapshot coverage thresholds
        shell: pwsh
        run: >-
          ./eng/verify-snapshot-coverage.ps1
          -ResultsDirectory TestResults
          -MinimumLineCoverage 90
          -MinimumBranchCoverage 80

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/*.log
            **/TestResults/**/*.cobertura.xml
          if-no-files-found: warn

  pack:
    name: Validate and pack NuGet packages
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore XBullet.EasyTesting.sln

      - name: Build
        run: >-
          dotnet build XBullet.EasyTesting.sln
          --configuration Release
          --no-restore
          -p:VersionSuffix=$PACKAGE_VERSION_SUFFIX

      - name: Pack
        shell: bash
        run: |
          for project in src/*/*.csproj; do
            dotnet pack "$project" \
              --configuration Release \
              --no-build \
              --output artifacts/packages \
              -p:VersionSuffix="$PACKAGE_VERSION_SUFFIX"
          done

      - name: Upload NuGet packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-preview-${{ github.run_number }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
