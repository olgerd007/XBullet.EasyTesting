name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  PACKAGE_VERSION_SUFFIX: preview.${{ github.run_number }}

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json

      - name: Restore
        run: dotnet restore XBullet.EasyTesting.sln

      - name: Verify formatting
        run: dotnet format XBullet.EasyTesting.sln --verify-no-changes --no-restore

      - name: Build
        run: >-
          dotnet build XBullet.EasyTesting.sln
          --configuration Release
          --no-restore

      - name: Test
        run: >-
          dotnet test XBullet.EasyTesting.sln
          --configuration Release
          --no-build
          --results-directory TestResults
          --report-xunit-trx
          --coverage
          --coverage-output-format cobertura

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/*.log
            **/TestResults/**/*.cobertura.xml
          if-no-files-found: warn

  pack:
    name: Validate and pack NuGet packages
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json

      - name: Restore
        run: dotnet restore XBullet.EasyTesting.sln

      - name: Build
        run: >-
          dotnet build XBullet.EasyTesting.sln
          --configuration Release
          --no-restore
          -p:VersionSuffix=$PACKAGE_VERSION_SUFFIX

      - name: Pack
        shell: bash
        run: |
          for project in src/*/*.csproj; do
            dotnet pack "$project" \
              --configuration Release \
              --no-build \
              --output artifacts/packages \
              -p:VersionSuffix="$PACKAGE_VERSION_SUFFIX"
          done

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-preview-${{ github.run_number }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
