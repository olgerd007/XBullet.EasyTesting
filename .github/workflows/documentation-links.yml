name: Documentation links

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    name: Check external documentation links
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check internal and external links
        shell: pwsh
        run: >-
          ./eng/verify-documentation-links.ps1
          -CheckExternalLinks
          -TransientFailurePolicy Warn
